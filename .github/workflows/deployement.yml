
name: Create GitHub Issue

on:
  # Run from another workflow
  workflow_call:
    inputs:
      title:
        description: 'Issue title'
        required: true
        type: string
      body:
        description: 'Issue description'
        required: true
        type: string

  # Run manually from GitHub Actions
  workflow_dispatch:
    inputs:
      title:
        description: 'Enter issue title'
        required: true
        type: string
      body:
        description: 'Enter issue description'
        required: true
        type: string

permissions:
  issues: write

jobs:
  create_issue:
    runs-on: ubuntu-latest

    steps:
      - name: Create Issue using REST API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ inputs.title }}
          ISSUE_BODY: ${{ inputs.body }}

        run: |
          jq -n \
            --arg title "Failure: $ISSUE_TITLE" \
            --arg body "Details: $ISSUE_BODY" \
            '{title: $title, body: $body}' > issue.json

          RESPONSE=$(curl --silent --show-error --fail-with-body \
            --request POST \
            --url "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "Content-Type: application/json" \
            --data @issue.json)

          echo "Issue created successfully!"
          echo "$RESPONSE" | jq '{number, title, html_url}'
